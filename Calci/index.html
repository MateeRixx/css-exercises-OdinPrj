<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calci</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Arya:wght@400;700&family=Bitcount+Prop+Single:wght@100..900&family=Dekko&family=Gajraj+One&family=Kalam:wght@300;400;700&family=Petit+Formal+Script&family=Rozha+One&display=swap" rel="stylesheet">
  </head>
  <body>
   
    <div class="CalcultorBody">
      <div class="resultDisplayWindow">
        <span style=" background-color: #1A312C;
    color: #B0BA99;">25+9</span>
      </div>

      <div class="ButtonContainer">
        <div class="numbersGrid">
          <button class="Number-button">7</button>
          <button class="Number-button">8</button>
          <button class="Number-button">9</button>
          <button class="Number-button">4</button>
          <button class="Number-button">5</button>
          <button class="Number-button">6</button>
          <button class="Number-button">1</button>
          <button class="Number-button">2</button>
          <button class="Number-button">3</button>
        </div>

        <div class="OperationButtonGrid">
          <div class="clearButtonGrid">
            <button class="Box-button">
              <span class="button_top"> Clear </span>
            </button>
          </div>
          <div class="ArthiematicButtonGrid">
            <button  class="Number-button"id="plus">+</button>
            <button class="Number-button" id="minus">-</button>
            <button class="Number-button" id="multiply">x</button>
            <button class="Number-button" id="divide">%</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
